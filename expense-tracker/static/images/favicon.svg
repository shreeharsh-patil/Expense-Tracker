<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a472a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a472a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="16" cy="16" r="15" fill="url(#glow)"/>
  <!-- Main dot -->
  <circle cx="16" cy="16" r="10" fill="url(#dot-grad)"/>
  <!-- Inner highlight -->
  <circle cx="13" cy="12" r="4" fill="rgba(255,255,255,0.15)"/>
  <!-- Subtle ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
</svg>
