{% extends "base.html" %}

{% block title %}Server Error — Spendly{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center">
    <div class="mb-6">
        <span class="material-symbols-outlined text-6xl text-accent-red opacity-50">error</span>
    </div>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-4">Something went wrong</h1>
    <p class="text-slate-600 dark:text-dark-mute mb-8 max-w-md mx-auto">
        We encountered an internal server error. Our team has been notified (not really, but let's pretend).
    </p>
    <div class="flex items-center justify-center gap-4">
        <a href="{{ url_for('dashboard') }}" class="px-6 py-3 bg-primary text-white font-semibold rounded-lg shadow-md hover:brightness-110 transition-all">
            Back to Dashboard
        </a>
        <a href="mailto:support@spendly.app" class="px-6 py-3 bg-white dark:bg-dark-elevated text-slate-700 dark:text-white border border-slate-200 dark:border-dark-border font-semibold rounded-lg hover:bg-slate-50 dark:hover:bg-white/5 transition-all">
            Contact Support
        </a>
    </div>
</div>
{% endblock %}
