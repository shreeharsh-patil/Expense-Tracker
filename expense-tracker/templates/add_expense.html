{% extends "base.html" %}
{% block title %}Record Entry | Spendly{% endblock %}

{% block content %}
<section class="px-4 sm:px-6 py-12 flex justify-center relative overflow-hidden">
  <div class="glow-blob -top-10 -left-10 w-64 h-64 bg-primary/10"></div>
  <div class="glow-blob -bottom-10 -right-10 w-64 h-64 bg-signature-peach/10"></div>

  <div class="w-full max-w-[520px] relative z-10 animate-fade-in-up">

    <div class="mb-8 flex flex-col items-center text-center">
      <div class="w-14 h-14 rounded-2xl bg-primary/10 text-primary flex items-center justify-center mb-4 shadow-sm border border-primary/20">
        <span class="material-symbols-outlined text-[28px]">add_task</span>
      </div>
      <h1 class="heading-display-sm text-slate-900 dark:text-white mb-1 font-extrabold tracking-tight">Record Transaction</h1>
      <p class="body-text text-slate-500 dark:text-dark-mute">Append a new line-item to your financial ledger.</p>
    </div>

    <div class="card-apple p-8 shadow-2xl shadow-slate-200/40 dark:shadow-none hover-lift border-white/60 dark:border-white/5">
      <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2 group">
            <label for="amount" class="block text-[10px] font-mono font-bold text-slate-400 dark:text-dark-mute uppercase tracking-widest transition-colors group-focus-within:text-primary">Capital Amount (&#8377;)</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-0 text-slate-300 dark:text-dark-border text-[18px]">payments</span>
              <input type="number" step="0.01" id="amount" name="amount" class="w-full bg-transparent border-b border-slate-200 dark:border-dark-border py-2.5 pl-7 outline-none focus:border-primary dark:focus:border-primary-light transition-all text-sm font-mono font-bold text-slate-900 dark:text-white" placeholder="0.00" required autofocus>
            </div>
          </div>

          <div class="space-y-2 group">
            <label for="date" class="block text-[10px] font-mono font-bold text-slate-400 dark:text-dark-mute uppercase tracking-widest transition-colors group-focus-within:text-primary">Transaction Date</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-0 text-slate-300 dark:text-dark-border text-[18px]">calendar_today</span>
              <input type="date" id="date" name="date" class="w-full bg-transparent border-b border-slate-200 dark:border-dark-border py-2.5 pl-7 outline-none focus:border-primary dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white" required>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2 group">
            <label for="category" class="block text-[10px] font-mono font-bold text-slate-400 dark:text-dark-mute uppercase tracking-widest transition-colors group-focus-within:text-primary">Allocation Category</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-0 text-slate-300 dark:text-dark-border text-[18px]">category</span>
              <select id="category" name="category" class="w-full bg-transparent border-b border-slate-200 dark:border-dark-border py-2.5 pl-7 outline-none focus:border-primary dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white appearance-none cursor-pointer" required>
                <option value="Food">Food & Dining</option>
                <option value="Transport">Transportation</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills & Rent</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="space-y-2 group">
            <label for="payment_method" class="block text-[10px] font-mono font-bold text-slate-400 dark:text-dark-mute uppercase tracking-widest transition-colors group-focus-within:text-primary">Payment Channel</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-0 text-slate-300 dark:text-dark-border text-[18px]">credit_card</span>
              <select id="payment_method" name="payment_method" class="w-full bg-transparent border-b border-slate-200 dark:border-dark-border py-2.5 pl-7 outline-none focus:border-primary dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white appearance-none cursor-pointer">
                <option value="Cash">Physical Cash</option>
                <option value="Bank">Bank Transfer / UPI</option>
                <option value="Credit Card">Credit Instrument</option>
              </select>
            </div>
          </div>
        </div>

        <div class="space-y-2 group">
          <label for="description" class="block text-[10px] font-mono font-bold text-slate-400 dark:text-dark-mute uppercase tracking-widest transition-colors group-focus-within:text-primary">Memo / Description (Optional)</label>
          <div class="relative flex items-start">
            <span class="material-symbols-outlined absolute left-0 top-3 text-slate-300 dark:text-dark-border text-[18px]">description</span>
            <textarea id="description" name="description" class="w-full bg-transparent border-b border-slate-200 dark:border-dark-border py-2.5 pl-7 outline-none focus:border-primary dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white min-h-[80px] resize-none" rows="3" placeholder="Enter transaction details..."></textarea>
          </div>
        </div>

        <div class="flex gap-4 pt-6 border-t border-slate-100 dark:border-dark-border/40">
          <button type="submit" class="btn-primary flex-1 py-3 text-sm font-bold shadow-lg shadow-primary/20 flex items-center justify-center gap-2 group">
            Commit Entry
            <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
          </button>
          <a href="{{ url_for('dashboard') }}" class="btn-secondary flex-1 py-3 text-sm font-bold flex items-center justify-center no-underline">Abort</a>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
  // Set default date to today
  const dateInput = document.getElementById('date');
  if (!dateInput.value) {
    dateInput.valueAsDate = new Date();
  }
</script>
{% endblock %}
