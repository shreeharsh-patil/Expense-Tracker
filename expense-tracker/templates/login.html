{% extends "base.html" %}
{% block title %}Sign in | Spendly{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4 sm:px-6 py-12 relative overflow-hidden">
  <!-- Decorative Background Blobs -->
  <div class="glow-blob top-1/4 -left-20 w-72 h-72 bg-primary/10"></div>
  <div class="glow-blob bottom-1/4 -right-20 w-72 h-72 bg-signature-peach/10"></div>

  <div class="w-full max-w-[420px] relative z-10 animate-fade-in-up">
    <div class="mb-10 flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-primary to-primary-light text-white flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
        <span class="material-symbols-outlined text-[32px]">login</span>
      </div>
      <h1 class="heading-display-sm text-slate-900 dark:text-white mb-2 font-extrabold tracking-tight">Welcome back</h1>
      <p class="body-text text-slate-500 dark:text-dark-mute max-w-[300px]">Sign in to your Spendly account to manage your expenses.</p>
    </div>

    <div class="card-apple p-8 sm:p-10 shadow-2xl shadow-slate-200/50 dark:shadow-none border-white/60 dark:border-white/5 !rounded-3xl">
      <form method="POST" action="/login" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="space-y-2 group">
          <label for="email" class="block text-xs font-bold text-slate-700 dark:text-slate-300 transition-colors group-focus-within:text-primary">Email Address</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-dark-border text-[18px]">alternate_email</span>
            <input id="email" name="email" class="w-full bg-slate-50/50 dark:bg-dark-bg/50 border border-slate-200 dark:border-dark-border rounded-xl py-3 pl-11 pr-4 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white placeholder:text-slate-400 dark:placeholder:text-dark-border" type="email" placeholder="email@address.com" required autofocus>
          </div>
        </div>

        <div class="space-y-2 group">
          <div class="flex justify-between items-end">
            <label for="password" class="block text-xs font-bold text-slate-700 dark:text-slate-300 transition-colors group-focus-within:text-primary">Password</label>
            <a href="{{ url_for('forgot_password') }}" class="text-[10px] font-medium text-primary hover:text-primary-light transition-colors">Forgot password?</a>
          </div>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-dark-border text-[18px]">key</span>
            <input id="password" name="password" class="w-full bg-slate-50/50 dark:bg-dark-bg/50 border border-slate-200 dark:border-dark-border rounded-xl py-3 pl-11 pr-4 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white placeholder:text-slate-400 dark:placeholder:text-dark-border" type="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" class="btn-primary w-full py-3.5 text-sm font-bold shadow-xl shadow-primary/20 flex items-center justify-center gap-2 group !rounded-full">
            Sign In
            <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
          </button>
        </div>
      </form>
      
      <div class="mt-8 pt-6 border-t border-slate-100 dark:border-dark-border/40 text-center">
        <p class="text-sm text-slate-500 dark:text-dark-mute mb-2">Don't have an account?</p>
        <a href="{{ url_for('register') }}" class="text-sm font-bold text-primary hover:text-primary-light transition-colors flex items-center justify-center gap-1 group">
          Create a free account 
          <span class="material-symbols-outlined text-[16px] transition-transform group-hover:translate-x-0.5">arrow_forward</span>
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
