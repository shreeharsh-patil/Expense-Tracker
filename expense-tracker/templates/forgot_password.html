{% extends "base.html" %}
{% block title %}Forgot password | Spendly{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4 sm:px-6 py-12 relative overflow-hidden">
  <!-- Decorative Background Blobs -->
  <div class="glow-blob top-1/4 -left-20 w-72 h-72 bg-primary/10"></div>
  <div class="glow-blob bottom-1/4 -right-20 w-72 h-72 bg-signature-peach/10"></div>

  <div class="w-full max-w-[420px] relative z-10 animate-fade-in-up">
    <div class="mb-10 flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-2xl bg-signature-peach/10 text-signature-peach flex items-center justify-center mb-6 shadow-sm border border-signature-peach/20 rotate-3">
        <span class="material-symbols-outlined text-[32px]">lock_reset</span>
      </div>
      <h1 class="heading-display-sm text-slate-900 dark:text-white mb-2 font-extrabold tracking-tight">Vault Recovery</h1>
      <p class="body-text text-slate-500 dark:text-dark-mute max-w-[300px]">Enter your authorized email to initiate the passphrase reset protocol.</p>
    </div>

    <div class="card-apple p-8 shadow-2xl shadow-slate-200/50 dark:shadow-none border-white/60 dark:border-white/5">
      <form method="POST" action="/forgot-password" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="space-y-2 group">
          <label for="email" class="block text-[10px] font-mono font-bold text-slate-400 dark:text-dark-mute uppercase tracking-widest transition-colors group-focus-within:text-primary">Authorized Email</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-0 text-slate-300 dark:text-dark-border text-[18px]">alternate_email</span>
            <input id="email" name="email" class="w-full bg-transparent border-b border-slate-200 dark:border-dark-border py-2.5 pl-7 outline-none focus:border-primary dark:focus:border-primary-light transition-all text-sm font-medium text-slate-800 dark:text-white placeholder:text-slate-300 dark:placeholder:text-dark-border" type="email" placeholder="email@address.com" required autofocus>
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" class="btn-primary w-full py-3.5 text-xs font-bold shadow-xl shadow-primary/20 flex items-center justify-center gap-2 group">
            Send Reset Link
            <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">send</span>
          </button>
        </div>
      </form>
      
      <div class="mt-8 pt-6 border-t border-slate-100 dark:border-dark-border/40 text-center">
        <a href="{{ url_for('login') }}" class="text-xs font-bold text-slate-500 dark:text-dark-mute hover:text-primary dark:hover:text-primary-light transition-colors flex items-center justify-center gap-1 group">
          <span class="material-symbols-outlined text-sm transition-transform group-hover:-translate-x-0.5">arrow_back</span>
          Return to identification
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
