[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "spendly"
version = "1.0.0"
description = "Personal expense tracker with OCR scanning, budget alerts, and financial reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Spendly Team" },
]
keywords = ["expense-tracker", "finance", "flask", "budget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "flask>=3.1.0",
    "flask-wtf>=1.2.0",
    "psycopg2-binary>=2.9.0",
    "authlib>=1.3.0",
    "markupsafe>=3.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-flask>=1.3.0",
]

[project.urls]
Homepage = "https://spendly.app"
Repository = "https://github.com/spendly/spendly"
Documentation = "https://spendly.app/docs"

[tool.pytest.ini_options]
testpaths = ["expense-tracker"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
